#version: '3.8'

services:
  party-paco:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: party-paco-app
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      - PORT=6767
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/party_paco.db
    volumes:
      - party_paco_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6767/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  party_paco_data:
    driver: local
